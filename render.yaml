# Render Blueprint — one-click deploy for BoA Campaigns v5
# https://render.com/docs/blueprint-spec
#
# In the Render Dashboard: New + -> Blueprint -> connect this repo.
# Render provisions the database and web service together, already wired
# (DATABASE_URL set automatically, same region) — no manual copying needed.
#
# NOTE: this is a new data model from v4/Dare-to-Serve — use a FRESH database
# (a new service name, or reset the existing one) rather than pointing this
# at your v4 database; see README.md "Upgrading from v4" section.

databases:
  - name: boa-campaigns-db
    plan: free
    region: oregon

services:
  - type: web
    name: boa-campaigns
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boa-campaigns-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_TOKEN
        generateValue: true
      - key: HO_PASSWORD
        sync: false
      - key: DISTRICT_PASSWORD
        sync: false
      - key: BRANCH_PASSWORD
        sync: false
